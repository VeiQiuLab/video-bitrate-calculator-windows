name: test-and-package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned build dependency
        run: python -m pip install -r requirements-build.txt
      - name: Tests, build and bounded executable check
        run: python -B tools/build.py
      - name: Package with licenses and hashes
        run: python tools/package_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: video-bitrate-calculator-windows
          path: release/*
          if-no-files-found: error
          retention-days: 14
